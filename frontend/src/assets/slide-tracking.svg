<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="mapGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0fdf4"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#mapGrad)"/>
  <!-- Map background -->
  <rect x="50" y="50" width="650" height="350" rx="20" fill="#e0f2fe" opacity="0.5" stroke="#06b6d4" stroke-width="2"/>
  <!-- Route path -->
  <path d="M 100 280 Q 250 150 400 180 T 650 120" stroke="#0ea5a4" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Start point -->
  <circle cx="100" cy="280" r="16" fill="#22c55e"/>
  <circle cx="100" cy="280" r="10" fill="#fff"/>
  <!-- Waypoint 1 -->
  <circle cx="250" cy="150" r="14" fill="#f59e0b"/>
  <circle cx="250" cy="150" r="8" fill="#fff"/>
  <!-- Waypoint 2 -->
  <circle cx="400" cy="180" r="14" fill="#f59e0b"/>
  <circle cx="400" cy="180" r="8" fill="#fff"/>
  <!-- End point -->
  <circle cx="650" cy="120" r="16" fill="#ef4444"/>
  <circle cx="650" cy="120" r="10" fill="#fff"/>
  <!-- Delivery icon at end -->
  <g transform="translate(620, 70)">
    <rect width="50" height="50" rx="8" fill="#ef4444" opacity="0.2"/>
    <text x="25" y="32" font-size="28" text-anchor="middle" fill="#ef4444">📍</text>
  </g>
</svg>
