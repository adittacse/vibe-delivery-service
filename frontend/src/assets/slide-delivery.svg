<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#f0f9ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyGrad)"/>
  <!-- Road -->
  <rect x="0" y="340" width="800" height="160" fill="#d1d5db"/>
  <line x1="0" y1="380" x2="800" y2="380" stroke="#fff" stroke-width="3" stroke-dasharray="20,10"/>
  <!-- Truck body -->
  <g transform="translate(100,220)">
    <rect x="0" y="0" width="300" height="100" rx="15" fill="#0ea5a4"/>
    <rect x="220" y="-30" width="80" height="90" rx="10" fill="#0ea5a4"/>
    <!-- Cab window -->
    <rect x="240" y="-15" width="45" height="40" rx="5" fill="#e0f2fe"/>
    <!-- Wheels -->
    <circle cx="50" cy="100" r="20" fill="#1f2937"/>
    <circle cx="270" cy="100" r="20" fill="#1f2937"/>
    <circle cx="50" cy="100" r="12" fill="#d1d5db"/>
    <circle cx="270" cy="100" r="12" fill="#d1d5db"/>
  </g>
  <!-- Shine effect -->
  <rect x="120" y="240" width="40" height="50" rx="8" fill="#fff" opacity="0.2"/>
</svg>
