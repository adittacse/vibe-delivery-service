<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="payGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf2f8"/>
      <stop offset="1" stop-color="#f0fdf4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#payGrad)"/>
  <!-- Credit card 1 -->
  <g transform="translate(80,100)">
    <rect width="240" height="150" rx="15" fill="#7c3aed" opacity="0.9"/>
    <rect x="12" y="12" width="216" height="20" rx="4" fill="#fff" opacity="0.2"/>
    <circle cx="30" cy="110" r="18" fill="#f59e0b" opacity="0.7"/>
    <circle cx="35" cy="110" r="12" fill="#f59e0b" opacity="0.3"/>
    <text x="120" y="135" font-size="14" fill="#fff" text-anchor="middle" opacity="0.8">Visa</text>
  </g>
  <!-- Credit card 2 (overlapped) -->
  <g transform="translate(200,140)">
    <rect width="240" height="150" rx="15" fill="#0ea5a4" opacity="0.85"/>
    <rect x="12" y="12" width="216" height="20" rx="4" fill="#fff" opacity="0.2"/>
    <rect x="20" y="100" width="80" height="40" rx="6" fill="#22c55e" opacity="0.6"/>
    <text x="120" y="135" font-size="14" fill="#fff" text-anchor="middle" opacity="0.8">Mastercard</text>
  </g>
  <!-- Lock/Security icon -->
  <g transform="translate(560,180)">
    <rect x="0" y="30" width="100" height="110" rx="8" fill="none" stroke="#06b6d4" stroke-width="4"/>
    <path d="M 25 30 L 25 15 A 25 25 0 0 1 75 15 L 75 30" stroke="#06b6d4" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="50" cy="85" r="8" fill="#06b6d4"/>
    <line x1="50" y1="95" x2="50" y2="120" stroke="#06b6d4" stroke-width="3"/>
  </g>
  <!-- Checkmark -->
  <g transform="translate(650, 220)">
    <circle cx="0" cy="0" r="28" fill="#22c55e" opacity="0.15"/>
    <path d="M -10 0 L -2 8 L 10 -5" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
