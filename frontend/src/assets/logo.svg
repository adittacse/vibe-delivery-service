<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5a4"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  
  <!-- Circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGrad)" opacity="0.1"/>
  
  <!-- Main package -->
  <g transform="translate(60, 60)">
    <!-- Package box -->
    <rect x="0" y="15" width="80" height="65" rx="4" fill="#0ea5a4"/>
    <rect x="0" y="15" width="80" height="15" rx="4" fill="#06b6d4"/>
    
    <!-- Tape across top -->
    <rect x="35" y="12" width="10" height="25" fill="#fff" opacity="0.6"/>
    
    <!-- Shine effect -->
    <rect x="8" y="22" width="25" height="30" rx="3" fill="#fff" opacity="0.2"/>
  </g>
  
  <!-- Delivery truck element (side) -->
  <g transform="translate(120, 85)">
    <!-- Truck body -->
    <rect x="0" y="0" width="45" height="30" rx="3" fill="#7c3aed" opacity="0.9"/>
    <!-- Cab -->
    <rect x="38" y="-8" width="15" height="25" rx="2" fill="#7c3aed" opacity="0.9"/>
    <!-- Cab window -->
    <rect x="42" y="-5" width="8" height="10" rx="1" fill="#fff" opacity="0.4"/>
    <!-- Wheels -->
    <circle cx="15" cy="30" r="5" fill="#1f2937" opacity="0.8"/>
    <circle cx="40" cy="30" r="5" fill="#1f2937" opacity="0.8"/>
  </g>
  
  <!-- Motion lines (suggest speed/vibe) -->
  <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="20" y1="75" x2="35" y2="75"/>
    <line x1="18" y1="85" x2="38" y2="85"/>
    <line x1="25" y1="95" x2="40" y2="95"/>
  </g>
  
  <!-- Checkmark accent -->
  <g transform="translate(145, 50)">
    <circle cx="0" cy="0" r="12" fill="#22c55e" opacity="0.15"/>
    <path d="M -4 0 L -1 3 L 4 -2" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>